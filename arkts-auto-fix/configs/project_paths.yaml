# 项目相关路径配置
# Project paths configuration

# 仓库根目录（支持多个仓库）
repos:
  - "/path/to/repo1"
  - "/path/to/repo2"

# 缓存目录
cache:
  embeddings: "test_output/embeddings_cache"
  summaries: "test_output/summaries"

# 输出目录
output:
  locator: "test_output/locator_output.json"
  patches: "test_output/patches"
  workflow: "test_output"

# 临时目录
temp: "test_output/temp"

