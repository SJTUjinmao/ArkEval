# 模型与服务相关配置
# Model and service related configuration

# Ollama 服务配置
ollama:
  host: "http://localhost:11500"
  timeout: 120  # 请求超时时间（秒）

# 嵌入模型配置
embedding:
  model: "qwen3-embedding:8b"
  batch_size: 32  # 批量处理大小
  dimension: 1024  # 向量维度

# LLM 模型配置
llm:
  model: "qwen2.5-coder:7b"  # 已替换为更小的模型（显存需求从 17.3GB 降至 4.4GB）
  temperature: 0.1  # 温度参数（较低值使结果更确定）
  max_tokens: 2048  # 最大生成 token 数
  context_size: 8192  # 上下文窗口大小（num_ctx），7b 模型建议使用 8k（可根据模型调整：4096, 8192, 16384）
  timeout: 300  # 请求超时时间（秒）

